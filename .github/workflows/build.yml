name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Resolve tool versions
        id: versions
        run: |
          versions=$(sh ./versions.sh)
          printf '%s\n' "$versions"
          {
            echo 'args<<EOF'
            printf '%s\n' "$versions"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short,enable=${{ github.event_name != 'schedule' }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=schedule,pattern=nightly-{{date 'YYYYMMDD'}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ steps.versions.outputs.args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Resolve tool versions
        id: versions
        run: |
          versions=$(sh ./versions.sh)
          printf '%s\n' "$versions"
          printf '%s\n' "$versions" > "$RUNNER_TEMP/versions.env"
          {
            echo 'args<<EOF'
            printf '%s\n' "$versions"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build for tests
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: dev-stack:ci
          build-args: ${{ steps.versions.outputs.args }}
          cache-from: type=gha

      # The regression this guards: /etc/profile rewrites PATH, so a login shell
      # (what Orca's remote terminals spawn) lost /root/.opencode/bin.
      # `opencode --version` is deliberately not used here: on a container with no
      # seeded config it initializes runtime state and can block indefinitely, so
      # it is not a bounded check. Resolving the binary is what regressed.
      - name: opencode resolves in a login shell with a stripped PATH
        run: timeout 60 docker run --rm --entrypoint bash -e PATH=/usr/local/bin:/usr/bin:/bin dev-stack:ci -lc 'command -v opencode'

      - name: opencode resolves in a non-login shell
        run: timeout 60 docker run --rm --entrypoint sh dev-stack:ci -c 'command -v opencode'

      - name: entrypoint guards a stale OPENCODE_CONFIG
        run: docker run --rm --entrypoint grep dev-stack:ci -q 'is not readable, ignoring it' /usr/local/bin/dev-stack-entrypoint

      - name: entrypoint clears stale Orca runtime artifacts
        run: |
          docker run --rm --entrypoint grep dev-stack:ci -q 'Singleton' /usr/local/bin/dev-stack-entrypoint
          docker run --rm --entrypoint grep dev-stack:ci -q 'daemon/\*\.sock' /usr/local/bin/dev-stack-entrypoint

      # Declared toolchains must resolve without a login shell or a seeded PATH.
      - name: language toolchains resolve
        run: >
          timeout 60 docker run --rm --entrypoint sh dev-stack:ci -c
          'command -v cc cargo rustfmt rust-analyzer luacheck busted poetry
          golangci-lint go git-lfs cmake fish zsh gdb'

      # Guards the build-arg plumbing: an arg that resolves but never reaches the
      # image would leave the smoke job green while baking an older tool.
      - name: image carries the resolved versions
        run: |
          for v in OPENCODE_VERSION ORCA_VERSION; do
            want=$(sed -n "s/^$v=//p" "$RUNNER_TEMP/versions.env")
            got=$(docker run --rm --entrypoint printenv dev-stack:ci "$v")
            echo "$v: resolved=$want image=$got"
            [ -n "$want" ] && [ "$got" = "$want" ] || exit 1
          done

