name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build for tests
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: dev-stack:ci
          cache-from: type=gha

      # The regression this guards: /etc/profile rewrites PATH, so a login shell
      # (what Orca's remote terminals spawn) lost /root/.opencode/bin.
      # `opencode --version` is deliberately not used here: on a container with no
      # seeded config it initializes runtime state and can block indefinitely, so
      # it is not a bounded check. Resolving the binary is what regressed.
      - name: opencode resolves in a login shell with a stripped PATH
        run: timeout 60 docker run --rm -e PATH=/usr/local/bin:/usr/bin:/bin dev-stack:ci bash -lc 'command -v opencode'

      - name: opencode resolves in a non-login shell
        run: timeout 60 docker run --rm dev-stack:ci sh -c 'command -v opencode'

      - name: entrypoint guards a stale OPENCODE_CONFIG
        run: docker run --rm dev-stack:ci grep -q 'is not readable, ignoring it' /usr/local/bin/dev-stack-entrypoint

      - name: entrypoint clears stale Orca runtime artifacts
        run: |
          docker run --rm dev-stack:ci grep -q 'Singleton' /usr/local/bin/dev-stack-entrypoint
          docker run --rm dev-stack:ci grep -q 'daemon/\*\.sock' /usr/local/bin/dev-stack-entrypoint

